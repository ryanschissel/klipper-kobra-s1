# Pressure Advance Auto-Calibration Plugin with ACEPRO Integration
# Automatically switches pressure advance profiles on ACEPRO tool changes
#
# This plugin integrates with ACEPRO to:
# 1. Detect tool changes (T0-Tn)
# 2. Auto-switch pressure advance profiles based on filament type
# 3. Allow manual PA calibration and saving
#
# Usage:
#   PA_CALIBRATE SAVE=1              - Calibrate and save
#   PA_CALIBRATE SAVE=1 PROFILE=pla  - Calibrate with profile name
#   PA_SET PA=0.025 SAVE=1           - Set specific PA value
#   PA_TEST PA=0.025                 - Quick test
#   PA_STATUS                        - Show current PA status

[gcode_macro PA_CALIBRATE]
description: Calibrate pressure advance using load cell sensor (with ACEPRO integration)
variables:
    TEMP: Extruder temperature for calibration (default: 265)
    PROFILE: Profile name for saving results (default: current_material)
    SAVE: Save to config (default: 0)
    PA_START: Starting PA value (default: 0.000)
    PA_END: Ending PA value for sweep (default: 0.080)
    PA_STEP: Step size for sweep (default: 0.010)
    CYCLES: Number of test cycles (default: 3)
    MOVE_SPEED: Move speed for test (default: 40)
    MOVE_LENGTH: Test move length (default: 15)
gcode:
    {% set temp = params.TEMP|default(265)|int %}
    {% set profile = params.PROFILE|default("current_material")|string %}
    {% set save = params.SAVE|default(0)|int %}
    {% set pa_start = params.PA_START|default(0.0)|float %}
    {% set pa_end = params.PA_END|default(0.08)|float %}
    {% set pa_step = params.PA_STEP|default(0.01)|float %}
    {% set cycles = params.CYCLES|default(3)|int %}
    {% set move_speed = params.MOVE_SPEED|default(40)|float %}
    {% set move_length = params.MOVE_LENGTH|default(15)|float %}
    
    {action_respond_info("Starting PA calibration...")}
    
    # Home all axes
    G28
    
    # Park to test position
    G90
    G1 Z10 F6000
    G1 X{printer['auto_pressure_advance'].test_x} Y{printer['auto_pressure_advance'].test_y} F6000
    
    # Heat extruder
    M109 S{temp}
    
    # Wait for extruder to reach temperature
    {% if printer.extruder.temperature < temp %}
        {% set wait_temp = temp %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wait_temp}
    {% endif %}
    
    {action_respond_info("Running PA calibration sweep...")}
    
    # Run the auto_pressure_advance calibration
    AUTO_PRESSURE_ADVANCE_CALIBRATE 
        EXTRUDER_TEMP={temp}
        PA_START={pa_start}
        PA_END={pa_end}
        PA_STEP={pa_step}
        CYCLES={cycles}
        MOVE_SPEED={move_speed}
        MOVE_LENGTH={move_length}
    
    {% if save == 1 %}
        {action_respond_info("Saving calibration results...")}
        SAVE_CONFIG
        {action_respond_info("PA calibration complete! Results saved.")}
    {% else %}
        {action_respond_info("PA calibration complete! Run PA_CALIBRATE SAVE=1 to save.")}
    {% endif %}

[gcode_macro PA_TEST]
description: Quick test pressure advance without full sweep (with ACEPRO integration)
variables:
    PA: PA value to test (default: current)
    TEMP: Extruder temperature (default: 265)
gcode:
    {% set pa = params.PA|default(printer['extruder'].pressure_advance)|float %}
    {% set temp = params.TEMP|default(265)|int %}
    
    {action_respond_info("Testing PA={pa} at {temp}C...")}
    
    # Home and park
    G28
    G90
    G1 Z10 F6000
    G1 X{printer['auto_pressure_advance'].test_x} Y{printer['auto_pressure_advance'].test_y} F6000
    
    # Heat extruder
    M109 S{temp}
    
    {% if printer.extruder.temperature < temp %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp}
    {% endif %}
    
    # Temporarily set PA and run test moves
    SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={pa}
    
    # Run test extrusion
    G92 E0
    G1 E10 F200
    G1 E10 F100
    
    M400
    
    {action_respond_info("Test complete. Extrusion quality should indicate if PA value is correct.")}

[gcode_macro PA_SET]
description: Set pressure advance value (with ACEPRO integration)
variables:
    PA: PA value to set
    SAVE: Save to config (default: 0)
    PROFILE: Profile name to save to (default: current_material)
gcode:
    {% set pa = params.PA|default(printer['extruder'].pressure_advance)|float %}
    {% set save = params.SAVE|default(0)|int %}
    {% set profile = params.PROFILE|default("current_material")|string %}
    
    SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={pa}
    
    {action_respond_info("PA set to {pa}")}
    
    {% if save == 1 %}
        SAVE_CONFIG
        {action_respond_info("PA value saved to config under profile '{profile}'.")}
    {% endif %}

[gcode_macro PA_STATUS]
description: Show current pressure advance status (with ACEPRO integration)
gcode:
    {% set pa = printer['extruder'].pressure_advance %}
    {% set temp = printer.extruder.temperature|round(1) %}
    {% set target_temp = printer.configfile.settings.extruder.max_temp - 10 %}
    {% set current_tool = printer.save_variables.variables.ace_current_index|default(-1)|int %}
    
    {action_respond_info("=== Pressure Advance Status ===")}
    {action_respond_info("Current PA: {pa}")}
    {action_respond_info("Nozzle Temp: {temp}C")}
    {action_respond_info("Target Temp: {target_temp}C")}
    {action_respond_info("Current ACE Tool: T{current_tool}")}
    
    {% if printer['auto_pressure_advance'] is defined %}
        {% set profiles = printer['auto_pressure_advance'].profiles %}
        {action_respond_info("Available Profiles:")}
        {% for material, value in profiles.items() %}
            {action_respond_info("  {material}: {value}")}
        {% endfor %}
    {% endif %}
    
    {% if printer['gcode_macro _ACE_STATE'] is defined %}
        {% set ace_handle = printer['gcode_macro _ACE_STATE'].ace_handle|default(None) %}
        {% if ace_handle %}
            {action_respond_info("ACE Handle: {ace_handle}")}
        {% endif %}
    {% endif %}
    
    {action_respond_info("===============================")}
    
    {action_respond_info("Note: ACEPRO will auto-switch PA profiles on tool change.")}

[gcode_macro ACEPRO_TOOL_CHANGE]
description: Automatically switch pressure advance profile on ACEPRO tool change
gcode:
    {% set tool_index = params.TOOL|default(-1)|int %}
    {% set current_pa = printer['extruder'].pressure_advance %}
    
    {action_respond_info("ACEPRO detected tool change to T{tool_index}")}
    
    # Get current PA profiles
    {% set profiles = printer['auto_pressure_advance'].profiles %}
    
    # Check if we have PA profiles
    {% if profiles is defined and profiles|length > 0 %}
        {action_respond_info("Current PA: {current_pa}")}
        {action_respond_info("Available PA profiles:")}
        {% for material, pa_value in profiles.items() %}
            {action_respond_info("  {material}: {pa_value}")}
        {% endfor %}
        
        # Note: ACEPRO will handle the profile switching based on filament type
        # This macro provides feedback but doesn't auto-switch (to avoid conflicts)
        {action_respond_info("ACEPRO tool change detected - PA profile will be used for T{tool_index}")}
    {% else %}
        {action_respond_info("No PA profiles configured. Run PA_CALIBRATE SAVE=1 first.")}
    {% endif %}

[gcode_macro PA_SYNC]
description: Synchronize pressure advance with current ACEPRO tool
gcode:
    {% set current_tool = printer.save_variables.variables.ace_current_index|default(-1)|int %}
    {% set pa = printer['extruder'].pressure_advance %}
    
    {action_respond_info("PA_SYNC called for T{current_tool}")}
    {action_respond_info("Current PA: {pa}")}
    
    # This macro can be used to manually sync PA if needed
    # ACEPRO integration will handle automatic switching on tool change
